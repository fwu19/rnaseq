
max_table_rows: 1000000
export_plots: true

use_filename_as_sample_name:
  - cutadapt
  - fastp
  - trimgalore
  - picard

# Run only these modules
run_modules:
  - cutadapt
  - fastp
  - fastqc
  - trimgalore
  - star
  - featurecounts
  - samtools
  - picard
  - rna_seqc
  - rseqc
  - salmon
  - xengsort

module_order:
  - fastqc:
      name: "FastQC"
      path_filters:
        - "fastqc/*.zip"
  - fastqc:
      name: "FastQC_trimmed"
      path_filters:
        - "fastqc_trimmed/*.zip"
  - cutadapt:
      name: "Cutadapt"
      path_filters:
        - "cutadapt/*"  
  - cutadapt:
      name: "Cutadapt (Trim Galore)"
      path_filters:
        - "trimgalore/*"  
  - fastp:
      name: "Fastp"
      path_filters:
        - "fastp/*"  
  - trimgalore:
      name: "Trim Galore"
      path_filters:
        - "trimgalore/*"  
  - xengsort:
      name: "Xengsort classify"
      contents: "# Xengsort classify"
      num_lines: 2
      path_filters:
        - "xengsort/*"  
  - star:
      name: "STAR"
      path_filters:
        - "star_log/*"
        - "star_count/*"
  - star:
      name: "STAR (graft)"
      path_filters:
        - "star_count_graft/*"
        - "star_log_graft/*"
  - star:
      name: "STAR (host)"
      path_filters:
        - "star_count_host/*"
        - "star_log_host/*"
  - featurecounts:
      name: "featureCounts"
      path_filters:
        - "featureCounts/*"
  - featurecounts:
      name: "featureCounts_graft"
      path_filters:
        - "featureCounts_graft/*"
  - featurecounts:
      name: "featureCounts_host"
      path_filters:
        - "featureCounts_host/*"
  - salmon:
      name: "Salmon"
      path_filters:
        - "salmon/*"
  - salmon:
      name: "Salmon_host"
      path_filters:
        - "salmon_host/*"
  - salmon:
      name: "Salmon_graft"
      path_filters:
        - "salmon_graft/*"
  - samtools:
      name: "Samtools"
      path_filters:
        - "samtools/*"
  - samtools:
      name: "Samtools (alignment to graft genome)"
      path_filters:
        - "samtools_graft/*"
  - samtools:
      name: "Samtools (filtered alignment to graft genome with graft reads only)"
      path_filters:
        - "samtools_xeno/*"
  - samtools:
      name: "Samtools (alignment to host genome)"
      path_filters:
        - "samtools_host/*"
  - picard:
      name: "Picard"
      path_filters:
        - "gatk/*"
  - picard:
      name: "Picard (graft)"
      path_filters:
        - "gatk_graft/*"
  - picard:
      name: "Picard (host)"
      path_filters:
        - "gatk_host/*"
  - rna_seqc:
      name: "RNA-SeQC"
      path_filters:
        - "rnaseqc/*"
  - rna_seqc:
      name: "RNA-SeQC (graft)"
      path_filters:
        - "rnaseqc_graft/*"
  - rna_seqc:
      name: "RNA-SeQC (host)"
      path_filters:
        - "rnaseqc_host/*"
  - rseqc:
      name: "RSeQC"
      path_filters:
        - "rseqc/*"
  - rseqc:
      name: "RSeQC (graft)"
      path_filters:
        - "rseqc_graft/*"
  - rseqc:
      name: "RSeQC (host)"
      path_filters:
        - "rseqc_host/*"